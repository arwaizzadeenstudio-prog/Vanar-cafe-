<title>Vanar | فنار — A little taste of grandma's kitchen</title>

<style>
:root{--bur:#460700;--brn:#712900;--ol:#474700;--cream:#faf3e3;--ivory:#fffaf0;--beige:#ecdfc6;--ink:#3a2a22;--hf:"Playfair Display",Georgia,serif;--bf:Lora,Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl]{--hf:Amiri,"Playfair Display",serif;--bf:"Noto Naskh Arabic",Lora,serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:72px;height:auto}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.6 var(--bf);overflow-x:hidden}
h1,h2,h3{font-family:var(--hf);color:var(--bur);line-height:1.2;margin:0 0 .5em}
a{color:var(--brn)}img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 24px;border:2px solid var(--brn);background:var(--brn);color:#fff;border-radius:3px;font:600 16px var(--bf);cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--bur)}.btn.alt{background:transparent;color:var(--brn)}.btn.alt:hover{background:var(--beige)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.demo{background:var(--ol);color:#f6f0dc;text-align:center;font-size:13px;padding:6px 10px}
header{position:sticky;top:0;z-index:30;background:var(--ivory);border-bottom:1px solid var(--beige)}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.logo{font:700 24px var(--hf);color:var(--bur);text-decoration:none;margin-inline-end:auto;white-space:nowrap}
nav{display:flex;gap:22px}nav a{text-decoration:none;color:var(--bur);font-weight:600}nav a:hover{color:var(--ol)}
.ib{min-width:44px;height:44px;border:1px solid var(--beige);background:#fff;border-radius:50%;color:var(--bur);cursor:pointer;font:600 14px var(--bf);position:relative;display:inline-flex;align-items:center;justify-content:center}
.ib.lang{border-radius:22px;padding:0 14px}.ib svg{width:22px;height:22px}
#cnt{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--brn);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
#cnt.bump{animation:b .4s}@keyframes b{50%{transform:scale(1.4)}}
#burger{display:none}
@media(max-width:760px){#burger{display:inline-flex}nav{display:none;position:absolute;top:62px;inset-inline:0;background:var(--ivory);flex-direction:column;gap:0;border-bottom:1px solid var(--beige)}nav.open{display:flex}nav a{padding:14px 18px;border-top:1px solid var(--beige)}}
.hero{background:linear-gradient(var(--ivory),var(--cream));padding:36px 0 44px}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
.eyebrow{color:var(--ol);letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:600}
[dir=rtl] .eyebrow{letter-spacing:0}
.hero h1{font-size:clamp(34px,6vw,58px)}.hero p{max-width:30em}
.stagewrap{justify-self:center;width:min(100%,400px)}
.stage{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:10px solid #fff;outline:1px solid var(--beige);box-shadow:0 10px 30px rgba(70,7,0,.2);border-radius:200px 200px 6px 6px;overflow:hidden;cursor:pointer;background:var(--beige);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}.stage img.on{opacity:1}
.cap{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--brn)}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--beige);border:1px solid var(--brn)}.dots i.on{background:var(--brn)}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr;gap:24px}.hero{padding-top:24px}}
@media(prefers-reduced-motion:reduce){.stage img,.drawer,#cnt{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
section{padding:54px 0}section.alt{background:var(--ivory);border-block:1px solid var(--beige)}
.sh{text-align:center;margin-bottom:26px}.sh h2{font-size:clamp(28px,4vw,40px)}.sh p{margin:0;color:var(--ol)}
.orn{color:var(--ol);letter-spacing:.5em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.chip{min-height:42px;padding:6px 18px;border:1.5px solid var(--ol);background:transparent;color:var(--ol);border-radius:22px;font:600 15px var(--bf);cursor:pointer}.chip.on{background:var(--ol);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}.card .b{padding:10px}.card h3{font-size:16px}.card p{font-size:13px}}
.card{background:#fff;border:1px solid var(--beige);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--beige)}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:19px;margin:0}.card p{margin:0;font-size:14px;flex:1}
.price{font:700 18px var(--hf);color:var(--brn)}.card .btn{width:100%;min-height:44px;padding:8px}
.star{position:absolute;top:10px;inset-inline-start:10px;background:var(--bur);color:#fff;font-size:12px;padding:2px 10px;border-radius:2px}
.grid.big{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media(max-width:520px){.grid.big{grid-template-columns:1fr}}
.about{max-width:700px;margin:auto;text-align:center;font-size:18px}
.about q{display:block;font:italic 22px var(--hf);color:var(--brn);margin:18px 0}
.note{font-size:13px;color:#7a6a5e}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
footer{background:var(--bur);color:#f3e6cf;text-align:center;padding:38px 0 22px}
footer .logo{color:#fff;margin:0}footer nav{display:flex;position:static;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:6px 20px;margin:14px 0;background:none;border:0}footer nav a{color:#f3e6cf;padding:0;border:0}
.soc{display:flex;gap:14px;justify-content:center;margin:18px 0}.soc a{width:46px;height:46px;border:1px solid #c9a98a;border-radius:50%;display:grid;place-items:center;color:#f3e6cf}.soc a:hover{background:var(--brn)}.soc svg{width:22px;height:22px}
.credit{border-top:1px solid #6b2a20;padding-top:16px;margin-top:10px;font-size:13px}.credit a{color:#d9c29f}
.ov{position:fixed;inset:0;background:rgba(40,10,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--ivory);z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-100%)}.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--beige)}.dh h2{margin:0;font-size:24px}
.db{flex:1;overflow:auto;padding:14px 18px}.df{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--beige);background:#fff}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--beige)}
.it img{width:64px;height:64px;object-fit:cover;border-radius:3px}.it b{font-family:var(--hf);color:var(--bur);display:block;line-height:1.3}.it small{color:#7a6a5e}
.qty{display:flex;align-items:center;gap:4px;margin-top:6px}.qty button{width:38px;height:38px;border:1px solid var(--brn);background:#fff;color:var(--brn);border-radius:50%;font-size:20px;cursor:pointer}.qty span{min-width:26px;text-align:center;font-weight:600}
.rm{background:none;border:0;color:var(--brn);text-decoration:underline;cursor:pointer;font:14px var(--bf);min-height:38px}
.row{display:flex;justify-content:space-between;padding:3px 0}.row.t{font:700 20px var(--hf);color:var(--bur);border-top:1px solid var(--beige);margin-top:6px;padding-top:8px}
.empty{text-align:center;padding:50px 10px}
.f{margin-bottom:12px}.f label{display:block;font-weight:600;font-size:15px;margin-bottom:4px;color:var(--bur)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:10px;border:1.5px solid #cdb99a;border-radius:3px;background:#fff;font:16px var(--bf);color:var(--ink)}
.f .e{color:#a3150c;font-size:13px;min-height:0}.f .bad{border-color:#a3150c}
.rd{display:flex;gap:10px}.rd label{flex:1;border:1.5px solid #cdb99a;border-radius:3px;padding:10px;text-align:center;cursor:pointer;background:#fff;margin:0}.rd input{width:auto;min-height:0;margin-inline-end:6px}
.sent{background:#f3efd2;border:1px solid var(--ol);padding:12px;border-radius:3px;font-size:14px;margin-top:10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--ol);color:#fff;padding:10px 20px;border-radius:24px;z-index:60;opacity:0;transition:.3s;pointer-events:none;font-size:15px;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let lang="en",cat="all",cart={},view="cart",lastLink="";
try{lang=localStorage.getItem("vn_lang")||"en";cart=JSON.parse(localStorage.getItem("vn_cart")||"{}")}catch(e){}
const L=()=>lang==="ar"?1:0,t=k=>T[lang][k],P=id=>CONFIG.products.find(p=>p.id===id);
const money=n=>(Math.round(n*100)/100)+" "+CONFIG.currency;
const save=()=>{try{localStorage.setItem("vn_cart",JSON.stringify(cart))}catch(e){}};
function ph(p){const k=p.c,c={cookies:'<circle cx="100" cy="100" r="62" fill="#c98a4b"/><g fill="#4a2a18"><circle cx="80" cy="82" r="8"/><circle cx="118" cy="92" r="9"/><circle cx="96" cy="124" r="8"/><circle cx="128" cy="124" r="6"/></g>',donuts:'<circle cx="100" cy="100" r="58" fill="none" stroke="#c98a4b" stroke-width="40"/><circle cx="100" cy="100" r="58" fill="none" stroke="#f3e2c0" stroke-width="3" stroke-dasharray="3 9"/>',muffins:'<path d="M58 110h84l-12 52H70z" fill="#b8793c"/><path d="M52 112c0-40 24-62 48-62s48 22 48 62z" fill="#d9a766"/>',cakes:'<rect x="55" y="80" width="90" height="70" fill="#5a2a1a"/><rect x="55" y="104" width="90" height="8" fill="#e8d3a8"/><rect x="55" y="72" width="90" height="14" rx="6" fill="#3a1a10"/>'}[k];
return "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#efe2c8"/>'+c+'<text x="100" y="188" font-size="10" text-anchor="middle" fill="#712900" font-family="serif">Sample photo</text></svg>')}
const src=p=>IMAGES[p.img]||ph(p);
function card(p){return `<article class="card">${p.best?`<span class="star">${t("bestb")}</span>`:""}<img src="${src(p)}" alt="${p.n[L()]}" loading="lazy"><div class="b"><h3>${p.n[L()]}</h3><p>${p.d[L()]}</p><div class="price">${money(p.price)}</div><button class="btn" data-add="${p.id}">${t("add")}</button></div></article>`}
function renderStatic(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#lang").textContent=lang==="ar"?"English":"العربية";
$("#bestgrid").innerHTML=CONFIG.products.filter(p=>p.best).map(card).join("");
$("#chips").innerHTML=[["all",t("all"),t("all")],...CONFIG.categories].map(c=>`<button class="chip ${cat===c[0]?"on":""}" data-cat="${c[0]}">${c[0]==="all"?c[1]:c[1+L()]}</button>`).join("");
$("#grid").innerHTML=CONFIG.products.filter(p=>cat==="all"||p.c===cat).map(card).join("");
$("#wa").href=waBase();$("#ig").href=CONFIG.social.instagram;$("#fb").href=CONFIG.social.facebook;heroText();renderCart()}
const waNum=()=>CONFIG.whatsapp.replace(/\D/g,""),waBase=()=>"https://wa.me/"+waNum();
/* HERO */
let hi=0,lock=false,pause=0,front=1;const RM=matchMedia("(prefers-reduced-motion: reduce)");
function heroText(){const p=P(CONFIG.hero[hi]);$("#hname").textContent=p.n[L()];$("#h"+front).alt=p.n[L()];$("#dots").innerHTML=CONFIG.hero.map((_,i)=>`<i class="${i===hi?"on":""}"></i>`).join("")}
function heroShow(i){hi=i%CONFIG.hero.length;const p=P(CONFIG.hero[hi]),n=front===1?2:1;$("#h"+n).src=src(p);$("#h"+n).classList.add("on");$("#h"+front).classList.remove("on");front=n;heroText()}
function heroNext(){if(lock)return;lock=true;heroShow(hi+1);setTimeout(()=>lock=false,RM.matches?100:700)}
$("#stage").addEventListener("click",()=>{heroNext();pause=Date.now()+10000});
setInterval(()=>{if(!RM.matches&&Date.now()>pause&&!document.hidden)heroNext()},4000);
/* CART */
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0),sub=()=>Object.entries(cart).reduce((a,[id,q])=>a+P(id).price*q,0);
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}
function openCart(v){view=v||"cart";$("#drawer").classList.add("open");$("#ov").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");renderCart()}
function closeCart(){$("#drawer").classList.remove("open");$("#ov").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true")}
function renderCart(){const c=$("#cnt");c.textContent=count();save();const ids=Object.keys(cart).filter(id=>P(id));
if(!ids.length&&view==="checkout")view="cart";$("#dtitle").textContent=view==="cart"?t("cart"):t("co");
if(view==="cart"){if(!ids.length){$("#db").innerHTML=`<div class="empty"><p>${t("empty")}</p><button class="btn" data-go="menu">${t("back")}</button></div>`;$("#df").innerHTML="";return}
$("#db").innerHTML=ids.map(id=>{const p=P(id),q=cart[id];return `<div class="it"><img src="${src(p)}" alt=""><div><b>${p.n[L()]}</b><small>${money(p.price)}</small><div class="qty"><button data-q="${id}" data-d="-1" aria-label="-">−</button><span>${q}</span><button data-q="${id}" data-d="1" aria-label="+">+</button></div></div><div style="text-align:end"><b>${money(p.price*q)}</b><button class="rm" data-rm="${id}">${t("rm")}</button></div></div>`}).join("");
$("#df").innerHTML=`<div class="row"><span>${t("sub")}</span><b>${money(sub())}</b></div><div class="row t"><span>${t("sub")}</span><span>${money(sub())}</span></div><button class="btn" style="width:100%;margin-top:10px" data-view="checkout">${t("checkout")}</button><button class="btn alt" style="width:100%;margin-top:8px" data-go="menu">${t("cont")}</button>`;return}
const v=k=>($("#"+k)||{}).value||"";const keep={name:v("fn"),phone:v("fp"),addr:v("fa"),date:v("fd"),time:v("ft"),notes:v("fnotes"),type:($("input[name=ot]:checked")||{}).value||"delivery"};
$("#db").innerHTML=`<form id="form" novalidate><div class="f"><label for="fn">${t("name")} *</label><input id="fn" autocomplete="name"><div class="e"></div></div><div class="f"><label for="fp">${t("phone")} *</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel"><div class="e"></div></div>
<div class="f"><label>${t("type")} *</label><div class="rd"><label><input type="radio" name="ot" value="delivery">${t("deliv")}</label><label><input type="radio" name="ot" value="pickup">${t("pick")}</label></div></div>
<div class="f" id="addrf"><label for="fa">${t("addr")} *</label><textarea id="fa" rows="2" autocomplete="street-address"></textarea><div class="e"></div></div>
<div class="f"><label for="fd">${t("date")} *</label><input id="fd" type="date"><div class="e"></div></div><div class="f"><label for="ft">${t("time")} *</label><input id="ft" type="time"><div class="e"></div></div>
<div class="f"><label for="fnotes">${t("notes")}</label><textarea id="fnotes" rows="2"></textarea></div><div id="sentbox"></div></form>`;
$("#fn").value=keep.name;$("#fp").value=keep.phone;$("#fa").value=keep.addr;$("#fd").value=keep.date;$("#ft").value=keep.time;$("#fnotes").value=keep.notes;
$("#fd").min=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$$("input[name=ot]").forEach(r=>{r.checked=r.value===keep.type;r.onchange=()=>{addrToggle();renderTotals()}});addrToggle();
$("#df").innerHTML=`<div id="tots"></div><button class="btn" style="width:100%;margin-top:10px" data-place="1">${t("place")}</button><button class="btn alt" style="width:100%;margin-top:8px" data-view="cart">${t("bk")}</button>`;renderTotals();
if(lastLink)$("#sentbox").innerHTML=sentHtml()}
const isDel=()=>($("input[name=ot]:checked")||{}).value==="delivery",fee=()=>isDel()?CONFIG.deliveryFee:0;
function addrToggle(){$("#addrf").style.display=isDel()?"":"none"}
function renderTotals(){$("#tots").innerHTML=`<div class="row"><span>${t("sub")}</span><span>${money(sub())}</span></div>${isDel()?`<div class="row"><span>${t("del")}</span><span>${money(fee())}</span></div>`:""}<div class="row t"><span>${t("tot")}</span><span>${money(sub()+fee())}</span></div>`}
function sentHtml(){return `<div class="sent">${t("sent")}<br><a href="${lastLink}" target="_blank" rel="noopener">${t("again")}</a> · <a href="#" data-clear="1">${t("clear")}</a></div>`}
function validate(){let ok=true;const chk=(id,bad,msg)=>{const i=$("#"+id),e=i.parentNode.querySelector(".e");const m=bad?msg:"";e.textContent=m;i.classList.toggle("bad",!!m);if(m)ok=false};
const today=$("#fd").min;chk("fn",!$("#fn").value.trim(),t("req"));const ph=$("#fp").value.trim();chk("fp",!ph?1:0,t("req"));if(ph)chk("fp",!/^\+?[\d\s\-()]{7,}$/.test(ph),t("badp"));
if(isDel())chk("fa",!$("#fa").value.trim(),t("req"));const d=$("#fd").value;chk("fd",!d,t("req"));if(d)chk("fd",d<today,t("badd"));chk("ft",!$("#ft").value,t("req"));
if(!ok){const b=$(".bad");if(b)b.focus()}return ok}
function buildMsg(){const o=[];const ids=Object.keys(cart);const del=isDel(),f=fee();
o.push("VANAR | فنار — "+t("nw"),"",t("cust")+": "+$("#fn").value.trim(),t("ph")+": "+$("#fp").value.trim(),t("ot")+": "+(del?t("deliv"):t("pick")));
if(del)o.push(t("ad")+": "+$("#fa").value.trim());o.push(t("rd")+": "+$("#fd").value,t("rt")+": "+$("#ft").value,"",t("od"),"");
ids.forEach(id=>{const p=P(id);o.push("* "+p.n[L()]+" × "+cart[id]+" = "+money(p.price*cart[id]))});
o.push("",t("sub")+": "+money(sub()));if(del)o.push(t("del")+": "+money(f));o.push(t("tot").toUpperCase()+": "+money(sub()+f));const n=$("#fnotes").value.trim();if(n)o.push("",t("nt")+": "+n);return o.join("\n")}
/* EVENTS */
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let x;
if(x=g("[data-add]")){const id=x.dataset.add;cart[id]=(cart[id]||0)+1;lastLink="";renderCart();const c=$("#cnt");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");toast(t("added")+": "+P(id).n[L()])}
else if(x=g("[data-q]")){const id=x.dataset.q;cart[id]=Math.max(0,cart[id]+ +x.dataset.d);if(!cart[id])delete cart[id];lastLink="";renderCart()}
else if(x=g("[data-rm]")){delete cart[x.dataset.rm];lastLink="";renderCart()}
else if(x=g("[data-cat]")){cat=x.dataset.cat;renderStatic()}
else if(x=g("[data-view]")){view=x.dataset.view;renderCart()}
else if(g("[data-go]")){closeCart();$("#menu").scrollIntoView()}
else if(g("[data-clear]")){e.preventDefault();cart={};lastLink="";view="cart";renderCart()}
else if(g("[data-place]")){if(!count()||!validate())return;lastLink=waBase()+"?text="+encodeURIComponent(buildMsg());window.open(lastLink,"_blank","noopener");$("#sentbox").innerHTML=sentHtml()}
else if(g("#cartbtn"))openCart("cart");else if(g("#close")||g("#ov"))closeCart();
else if(g("#lang")){lang=lang==="en"?"ar":"en";try{localStorage.setItem("vn_lang",lang)}catch(_){}renderStatic()}
else if(g("#burger")){const n=$("#nav");n.classList.toggle("open");$("#burger").setAttribute("aria-expanded",n.classList.contains("open"))}
else if(g("#nav a"))$("#nav").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
renderStatic();heroShow(0);
</script>
